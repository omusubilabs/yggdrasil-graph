version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
      d3:
        patterns:
          - 'd3-*'
          - '@types/d3-*'
      fonts:
        patterns:
          - '@fontsource/*'
          - '@fontsource-variable/*'
      lint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier'
          - 'prettier-*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(ci)'
